# Local stack for Urban Pulse.
# Infra (postgres/redpanda) is optional; app services build from Dockerfiles.
# Honesty: Java API still defaults to H2 in-memory — PostGIS is available for a future profile.
# Kafka inside containers: URBAN_PULSE_KAFKA_ENABLED defaults false so API starts without broker deps.
services:
  postgres:
    image: postgis/postgis:16-3.4
    profiles: ["infra"]
    environment:
      POSTGRES_DB: urbanpulse
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
    ports:
      - "5432:5432"
    volumes:
      - up_pg:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    profiles: ["infra"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
    ports:
      - "9092:9092"

  ml:
    build:
      context: ./services/ml-inference
    ports:
      - "3851:3851"

  api:
    build:
      context: ./services/api-java
    ports:
      - "3847:3847"
    environment:
      URBAN_PULSE_KAFKA_ENABLED: "false"
      URBANPULSE_ML_BASE_URL: http://ml:3851
    depends_on:
      - ml

  web:
    build:
      context: ./apps/web
    ports:
      - "5178:80"
    depends_on:
      - api

volumes:
  up_pg:
