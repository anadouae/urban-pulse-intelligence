# Optional local stack for Milestone 2+.
# Milestone 1 runs without Docker (H2 + in-process aggregation).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: urbanpulse
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse
    ports:
      - "5432:5432"
    volumes:
      - up_pg:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://127.0.0.1:9092
    ports:
      - "9092:9092"

volumes:
  up_pg:
