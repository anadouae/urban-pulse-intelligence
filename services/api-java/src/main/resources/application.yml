server:
  port: 3847

spring:
  application:
    name: urban-pulse-api
  datasource:
    url: jdbc:h2:mem:urbanpulse;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # Demo only — disable with URBAN_PULSE_H2_CONSOLE=false or profile=postgres
      enabled: ${URBAN_PULSE_H2_CONSOLE:true}
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    consumer:
      group-id: urban-pulse-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

urbanpulse:
  city-id: demo-harbor
  city-label: "Harbor District (procedural demo)"
  source-kind-default: simulated
  ml-base-url: http://127.0.0.1:3851
  kafka:
    enabled: ${URBAN_PULSE_KAFKA_ENABLED:true}
    traffic-topic: urban.traffic.events
  security:
    api-key: ${URBAN_PULSE_API_KEY:}
    api-key-required: ${URBAN_PULSE_API_KEY_REQUIRED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.urbanpulse: INFO
    org.springframework.kafka: INFO
